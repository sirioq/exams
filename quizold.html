<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENGAA 2018 · Section 1 · Timed Delivery</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{
    --navy:#132038;
    --navy-2:#1c2e4e;
    --paper:#eef1f6;
    --card:#ffffff;
    --line:#d4dae4;
    --ink:#1a2233;
    --ink-soft:#5b6478;
    --accent:#2f5fa8;
    --accent-soft:#e7eefb;
    --flag:#b8860b;
    --flag-soft:#fdf3dd;
    --answered:#2f7a4f;
    --answered-soft:#e5f4ea;
    --wrong:#b3261e;
    --wrong-soft:#fbe9e8;
    --serif: Georgia, 'Times New Roman', Cambria, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- TOP BAR ---------- */
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:10px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    position:sticky; top:0; z-index:40;
    box-shadow:0 1px 0 rgba(0,0,0,0.15);
  }
  .brand{display:flex; flex-direction:column; line-height:1.15;}
  .brand .kicker{font-size:10.5px; letter-spacing:.04em; color:#9fb0cc;}
  .brand .title{font-size:14px; font-weight:600;}
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .timer{
    font-variant-numeric: tabular-nums;
    font-size:16px;
    font-weight:700;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    padding:6px 12px;
    border-radius:6px;
    min-width:76px;
    text-align:center;
  }
  .timer.low{background:rgba(179,38,30,0.35); border-color:#e08b85; color:#ffe9e8;}
  .icon-btn{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    color:#fff;
    width:36px;height:36px;
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{background:rgba(255,255,255,0.2);}
  .btn{
    font-family:var(--sans);
    border:none;
    border-radius:6px;
    padding:9px 16px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-submit{background:#c8442f; color:#fff;}
  .btn-submit:active{background:#a83a28;}

  /* ---------- LAYOUT ---------- */
  .layout{flex:1; display:flex; min-height:0;}
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}

  .progress-strip{
    background:var(--card);
    border-bottom:1px solid var(--line);
    padding:8px 16px;
    font-size:12.5px;
    color:var(--ink-soft);
    display:flex; justify-content:space-between; align-items:center;
  }
  .progress-bar{height:4px; background:var(--line); border-radius:2px; overflow:hidden; flex:1; margin:0 12px;}
  .progress-fill{height:100%; background:var(--accent); width:0%;}

  .question-wrap{flex:1; overflow-y:auto; padding:20px 18px 100px;}
  .q-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px 20px 8px;
    max-width:760px;
    margin:0 auto 16px;
  }
  .q-meta{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .q-number{
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:700;
    color:var(--accent);
    letter-spacing:.02em;
  }
  .q-part{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}
  .flag-btn{
    display:flex; align-items:center; gap:5px;
    background:none; border:1px solid var(--line); border-radius:6px;
    padding:5px 10px; font-size:12px; color:var(--ink-soft); cursor:pointer;
    font-family:var(--sans); font-weight:600;
  }
  .flag-btn.on{background:var(--flag-soft); border-color:var(--flag); color:var(--flag);}
  .q-text{
    font-family:var(--serif);
    font-size:17px;
    line-height:1.6;
    color:var(--ink);
  }
  .q-text p{margin:0 0 12px;}
  .q-diagram{margin:14px 0; text-align:center;}
  .q-diagram svg{max-width:100%; height:auto;}
  .diagram-caption{font-size:11.5px; color:var(--ink-soft); font-style:italic; margin-top:4px;}

  .options{margin:16px 0 10px; display:flex; flex-direction:column; gap:8px;}
  .option{
    display:flex; align-items:flex-start; gap:12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:11px 14px;
    cursor:pointer;
    background:#fff;
    transition:border-color .12s, background .12s;
  }
  .option:active{background:#f5f7fb;}
  .option.selected{border-color:var(--accent); background:var(--accent-soft);}
  .option-key{
    flex:0 0 auto;
    width:26px; height:26px;
    border-radius:50%;
    border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--sans); font-weight:700; font-size:12.5px; color:var(--ink-soft);
    background:#fff;
  }
  .option.selected .option-key{background:var(--accent); border-color:var(--accent); color:#fff;}
  .option-text{font-family:var(--serif); font-size:16px; line-height:1.5; padding-top:2px;}

  /* result states on review */
  .option.correct{border-color:var(--answered); background:var(--answered-soft);}
  .option.correct .option-key{background:var(--answered); border-color:var(--answered); color:#fff;}
  .option.incorrect{border-color:var(--wrong); background:var(--wrong-soft);}
  .option.incorrect .option-key{background:var(--wrong); border-color:var(--wrong); color:#fff;}

  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--card);
    border-top:1px solid var(--line);
    padding:10px 14px;
    display:flex; gap:10px; align-items:center; justify-content:space-between;
    z-index:30;
  }
  .nav-btn{
    flex:1;
    font-family:var(--sans); font-weight:700; font-size:13.5px;
    padding:12px 10px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  .nav-btn.primary{background:var(--navy); color:#fff; border-color:var(--navy);}
  .nav-btn:disabled{opacity:.4;}
  .grid-toggle{flex:0 0 auto; width:48px;}

  /* ---------- NAVIGATOR PANEL (desktop sidebar / mobile drawer) ---------- */
  .navigator{
    width:280px; flex:0 0 auto;
    background:var(--card);
    border-left:1px solid var(--line);
    padding:16px;
    overflow-y:auto;
  }
  .navigator h3{margin:0 0 4px; font-size:13px; letter-spacing:.02em;}
  .nav-sub{font-size:11.5px; color:var(--ink-soft); margin-bottom:14px;}
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; font-size:11px; color:var(--ink-soft);}
  .legend span{display:flex; align-items:center; gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%; display:inline-block;}
  .dot.un{background:#fff; border:1.5px solid var(--line);}
  .dot.ans{background:var(--answered);}
  .dot.flag{background:var(--flag);}
  .dot.cur{background:var(--accent);}
  .part-label{font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin:14px 0 8px;}
  .grid{display:grid; grid-template-columns:repeat(6,1fr); gap:6px;}
  .gbtn{
    aspect-ratio:1; border-radius:6px; border:1.5px solid var(--line);
    background:#fff; font-family:var(--sans); font-weight:700; font-size:12px;
    color:var(--ink-soft); cursor:pointer; position:relative;
  }
  .gbtn.answered{background:var(--answered-soft); border-color:var(--answered); color:var(--answered);}
  .gbtn.flagged::after{
    content:''; position:absolute; top:-3px; right:-3px; width:8px;height:8px;
    background:var(--flag); border-radius:50%; border:1.5px solid #fff;
  }
  .gbtn.current{background:var(--accent); border-color:var(--accent); color:#fff;}

  /* Mobile drawer overlay */
  .nav-overlay{
    display:none;
    position:fixed; inset:0; background:rgba(10,15,25,0.45); z-index:50;
  }
  .nav-drawer{
    position:fixed; top:0; right:0; bottom:0; width:86%; max-width:340px;
    background:var(--card); z-index:51; padding:16px; overflow-y:auto;
    transform:translateX(100%); transition:transform .22s ease;
  }
  .nav-drawer.open{transform:translateX(0);}
  .nav-overlay.open{display:block;}
  .drawer-close{float:right; background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}

  @media (min-width: 860px){
    .grid-toggle{display:none;}
    .nav-overlay,.nav-drawer{display:none !important;}
  }
  @media (max-width: 859px){
    .navigator{display:none;}
    .bottom-nav{padding-bottom:calc(10px + env(safe-area-inset-bottom));}
  }

  /* ---------- START / RESULTS SCREENS ---------- */
  .screen{
    max-width:640px; margin:0 auto; padding:28px 20px 60px;
  }
  .screen h1{font-family:var(--serif); font-size:26px; margin:6px 0 2px;}
  .screen .sub{color:var(--ink-soft); font-size:14px; margin-bottom:22px;}
  .info-card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:18px 20px; margin-bottom:16px;
  }
  .info-card h4{margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft);}
  .info-row{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid #eef0f4; font-size:14.5px;}
  .info-row:last-child{border-bottom:none;}
  .start-btn{
    display:block; width:100%; background:var(--navy); color:#fff;
    font-family:var(--sans); font-weight:700; font-size:15px; padding:15px;
    border:none; border-radius:9px; cursor:pointer; margin-top:6px;
  }
  .score-big{font-family:var(--serif); font-size:52px; font-weight:700; color:var(--navy); text-align:center; margin:6px 0 0;}
  .score-sub{text-align:center; color:var(--ink-soft); font-size:14px; margin-bottom:20px;}
  .breakdown{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;}
  .bd-card{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:14px; text-align:center;}
  .bd-card .n{font-size:22px; font-weight:700; font-family:var(--serif);}
  .bd-card .l{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
  .review-list{display:flex; flex-direction:column; gap:8px;}
  .review-row{
    display:flex; align-items:center; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:10px 14px; cursor:pointer; font-size:13.5px;
  }
  .review-row .num{width:24px; font-weight:700; color:var(--ink-soft); font-family:var(--sans);}
  .review-row .status{margin-left:auto; font-weight:700; font-size:12px;}
  .review-row.correct .status{color:var(--answered);}
  .review-row.incorrect .status{color:var(--wrong);}
  .review-row.blank .status{color:var(--ink-soft);}
  .filter-tabs{display:flex; gap:8px; margin-bottom:14px;}
  .filter-tabs button{
    flex:1; padding:8px; border-radius:7px; border:1.5px solid var(--line);
    background:#fff; font-family:var(--sans); font-weight:600; font-size:12.5px; cursor:pointer;
  }
  .filter-tabs button.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .link-btn{background:none;border:none;color:var(--accent);font-family:var(--sans);font-weight:600;font-size:13px;cursor:pointer;padding:0;}
  .hidden{display:none !important;}
</style>
</head>

/* =========================================================================
   QUIZ ENGINE
   ========================================================================= */
const TOTAL_SECONDS = 80*60;
let state = {
  screen:'start',       // start | test | results
  current:0,
  answers:{},            // n -> key
  flags:{},              // n -> bool
  timeLeft:TOTAL_SECONDS,
  timerId:null,
  reviewFilter:'all',
  reviewFocus:null,
  studentName:'',
  submitStatus:'idle',   // idle | sending | sent | failed | unconfigured
};

/* =========================================================================
   TEACHER RESULTS COLLECTION (Google Form auto-submit)
   Fill these in once the Google Form is set up, then results from every
   student who finishes the test will be sent automatically — no action
   needed from the student beyond entering their name.
   ========================================================================= */
const RESULTS_FORM = {
  // Paste the form's response URL, e.g.
  // "https://docs.google.com/forms/d/e/1FAIpQLSxxxxxxxxxxxxxxxx/formResponse"
  actionUrl: "https://docs.google.com/forms/d/e/1FAIpQLSdMiczdM1uRX5OMQBgSg-s0iJBoPjjhk1eKQ-K8mmbyz6Ve6Q/formResponse",
  // Paste each field's entry ID, e.g. "entry.123456789"
  entries: {
    name: "entry.703912922",
    score: "entry.438848763",
    partA: "entry.1143970933",
    partB: "entry.1978863126",
    timeUsed: "entry.152608794",
    answers: "entry.1456935998",
  }
};

function buildAnswersString(){
  return QUESTIONS.map(q=>{
    const given = state.answers[q.n];
    if(given===undefined) return `${q.n}:—(${q.answer})`;
    if(given===q.answer) return `${q.n}:${given}`;
    return `${q.n}:${given}✗${q.answer}`;
  }).join(' ');
}

function isFormConfigured(){
  return !!RESULTS_FORM.actionUrl && !!RESULTS_FORM.entries.name;
}

function submitResultsToTeacher(s){
  if(!isFormConfigured()){
    state.submitStatus = 'unconfigured';
    render();
    return;
  }
  state.submitStatus = 'sending';
  render();
  const body = new URLSearchParams();
  body.append(RESULTS_FORM.entries.name, state.studentName || 'Unnamed');
  body.append(RESULTS_FORM.entries.score, `${s.correct}/${s.total}`);
  body.append(RESULTS_FORM.entries.partA, `${s.partA.correct}/${s.partA.total}`);
  body.append(RESULTS_FORM.entries.partB, `${s.partB.correct}/${s.partB.total}`);
  body.append(RESULTS_FORM.entries.timeUsed, fmtTime(TOTAL_SECONDS-state.timeLeft));
  if(RESULTS_FORM.entries.answers){
    body.append(RESULTS_FORM.entries.answers, buildAnswersString());
  }
  fetch(RESULTS_FORM.actionUrl, {method:'POST', mode:'no-cors', body})
    .then(()=>{ state.submitStatus='sent'; render(); })
    .catch(()=>{ state.submitStatus='failed'; render(); });
}

const app = document.getElementById('app');

function fmtTime(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

function renderMath(container){
  if(window.renderMathInElement){
    renderMathInElement(container, {
      delimiters:[
        {left:"$$", right:"$$", display:true},
        {left:"$", right:"$", display:false}
      ],
      throwOnError:false
    });
  }
}

function startQuiz(){
  const input = document.getElementById('studentNameInput');
  const name = input ? input.value.trim() : '';
  if(!name){
    alert('Please enter your name before starting the test.');
    if(input) input.focus();
    return;
  }
  state.studentName = name;
  state.screen='test';
  state.current=0;
  state.answers={};
  state.flags={};
  state.timeLeft=TOTAL_SECONDS;
  state.submitStatus='idle';
  render();
  state.timerId = setInterval(()=>{
    state.timeLeft--;
    if(state.timeLeft<=0){
      clearInterval(state.timerId);
      state.timeLeft=0;
      finishQuiz();
      return;
    }
    updateTimerDisplay();
  },1000);
}

function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  if(!el) return;
  el.textContent = fmtTime(state.timeLeft);
  el.classList.toggle('low', state.timeLeft<=300);
}

function selectAnswer(n,key){
  state.answers[n]=key;
  render();
}

function toggleFlag(n){
  state.flags[n]=!state.flags[n];
  render();
}

function goTo(n){
  state.current=n;
  render();
  window.scrollTo(0,0);
  const qw = document.querySelector('.question-wrap');
  if(qw) qw.scrollTop=0;
}

function finishQuiz(){
  if(state.timerId) clearInterval(state.timerId);
  state.screen='results';
  state.reviewFilter='all';
  render();
  submitResultsToTeacher(scoreData());
}

function confirmSubmit(){
  const answered = Object.keys(state.answers).length;
  const remaining = 54-answered;
  const msg = remaining>0
    ? `You have ${remaining} unanswered question${remaining===1?'':'s'}. Submit anyway?`
    : `Submit your answers now?`;
  if(confirm(msg)) finishQuiz();
}

function restart(){
  state = {screen:'start', current:0, answers:{}, flags:{}, timeLeft:TOTAL_SECONDS, timerId:null, reviewFilter:'all', reviewFocus:null, studentName:'', submitStatus:'idle'};
  render();
}

/* ---------- RENDER: START SCREEN ---------- */
function renderStart(){
  return `
  <div class="screen">
    <div class="brand" style="color:var(--navy); margin-bottom:18px;">
      <div class="kicker" style="color:var(--ink-soft)">ENGINEERING ADMISSIONS ASSESSMENT · D564/11</div>
      <h1>ENGAA 2018 — Section 1</h1>
      <div class="sub">Timed delivery · 54 questions · 80 minutes</div>
    </div>
    <div class="info-card">
      <h4>Test structure</h4>
      <div class="info-row"><span>Part A — Mathematics &amp; Physics</span><span>28 questions</span></div>
      <div class="info-row"><span>Part B — Advanced Mathematics &amp; Advanced Physics</span><span>26 questions</span></div>
      <div class="info-row"><span>Total</span><span>54 questions, 1 mark each</span></div>
      <div class="info-row"><span>Time limit</span><span>80 minutes</span></div>
      <div class="info-row"><span>Penalty for wrong answers</span><span>None</span></div>
    </div>
    <div class="info-card">
      <h4>Before you begin</h4>
      <div style="font-size:14px; line-height:1.6; color:var(--ink)">
        No calculators or dictionaries. You may flag questions to revisit and move freely between them.
        The timer starts as soon as you begin and will auto-submit at zero.
      </div>
    </div>
    <div class="info-card">
      <h4>Your name</h4>
      <input id="studentNameInput" type="text" placeholder="Enter your full name" value="${state.studentName||''}"
        style="width:100%; font-family:var(--sans); font-size:15px; padding:12px 14px; border:1.5px solid var(--line); border-radius:8px; box-sizing:border-box;">
      <div style="font-size:12px; color:var(--ink-soft); margin-top:8px;">Your name and score are sent to your teacher automatically when you finish.</div>
    </div>
    <button class="start-btn" onclick="startQuiz()">Begin timed test</button>
  </div>`;
}

/* ---------- RENDER: TEST SCREEN ---------- */
function optionLabel(q){
  return q.options;
}

function renderQuestion(q){
  const selected = state.answers[q.n];
  const flagged = !!state.flags[q.n];
  let html = `
  <div class="q-card">
    <div class="q-meta">
      <div><span class="q-number">QUESTION ${q.n} OF 54</span> &nbsp; <span class="q-part">Part ${q.part}</span></div>
      <button class="flag-btn ${flagged?'on':''}" onclick="toggleFlag(${q.n})">${flagged?'★ Flagged':'☆ Flag for review'}</button>
    </div>
    <div class="q-text"><p>${q.text}</p>
  `;
  if(q.diagram){
    html += `<div class="q-diagram">${DIAGRAMS[q.diagram]}${q.caption?`<div class="diagram-caption">${q.caption}</div>`:''}</div>`;
  }
  if(q.after){
    html += q.after;
  }
  html += `</div>`;
  html += `<div class="options">`;
  q.options.forEach(([key,text])=>{
    const sel = selected===key ? 'selected':'';
    html += `<div class="option ${sel}" onclick="selectAnswer(${q.n},'${key}')">
      <div class="option-key">${key}</div>
      <div class="option-text">${text}</div>
    </div>`;
  });
  html += `</div></div>`;
  return html;
}

function navGridHTML(){
  let rows = '';
  ['A','B'].forEach(part=>{
    rows += `<div class="part-label">Part ${part}</div><div class="grid">`;
    QUESTIONS.filter(q=>q.part===part).forEach(q=>{
      const answered = state.answers[q.n]!==undefined;
      const flagged = !!state.flags[q.n];
      const cur = q.n-1===state.current;
      rows += `<button class="gbtn ${answered?'answered':''} ${flagged?'flagged':''} ${cur?'current':''}" onclick="goTo(${q.n-1}); closeDrawer();">${q.n}</button>`;
    });
    rows += `</div>`;
  });
  return rows;
}

function renderTest(){
  const q = QUESTIONS[state.current];
  const answeredCount = Object.keys(state.answers).length;
  const pct = Math.round((answeredCount/54)*100);
  return `
  <div class="topbar">
    <div class="brand">
      <div class="kicker">ENGAA 2018 · SECTION 1</div>
      <div class="title">Timed Delivery</div>
    </div>
    <div class="topbar-right">
      <div class="timer" id="timerDisplay">${fmtTime(state.timeLeft)}</div>
      <button class="btn btn-submit" onclick="confirmSubmit()">Submit test</button>
    </div>
  </div>
  <div class="progress-strip">
    <span>${answeredCount} of 54 answered</span>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <span>${pct}%</span>
  </div>
  <div class="layout">
    <div class="main">
      <div class="question-wrap">
        ${renderQuestion(q)}
      </div>
      <div class="bottom-nav">
        <button class="nav-btn" onclick="goTo(${state.current-1})" ${state.current===0?'disabled':''}>← Previous</button>
        <button class="icon-btn grid-toggle" onclick="openDrawer()">☰</button>
        ${state.current===53
          ? `<button class="nav-btn primary" onclick="confirmSubmit()">Submit test</button>`
          : `<button class="nav-btn primary" onclick="goTo(${state.current+1})">Next →</button>`
        }
      </div>
    </div>
    <div class="navigator">
      <h3>Question navigator</h3>
      <div class="nav-sub">Tap any number to jump to that question.</div>
      <div class="legend">
        <span><span class="dot cur"></span>Current</span>
        <span><span class="dot ans"></span>Answered</span>
        <span><span class="dot flag"></span>Flagged</span>
        <span><span class="dot un"></span>Unanswered</span>
      </div>
      ${navGridHTML()}
    </div>
  </div>
  <div class="nav-overlay" id="navOverlay" onclick="closeDrawer()"></div>
  <div class="nav-drawer" id="navDrawer">
    <button class="drawer-close" onclick="closeDrawer()">×</button>
    <h3>Question navigator</h3>
    <div class="nav-sub">Tap any number to jump to that question.</div>
    <div class="legend">
      <span><span class="dot cur"></span>Current</span>
      <span><span class="dot ans"></span>Answered</span>
      <span><span class="dot flag"></span>Flagged</span>
      <span><span class="dot un"></span>Unanswered</span>
    </div>
    ${navGridHTML()}
  </div>
  `;
}

function openDrawer(){
  document.getElementById('navOverlay').classList.add('open');
  document.getElementById('navDrawer').classList.add('open');
}
function closeDrawer(){
  const o=document.getElementById('navOverlay'), d=document.getElementById('navDrawer');
  if(o) o.classList.remove('open');
  if(d) d.classList.remove('open');
}

/* ---------- RENDER: RESULTS SCREEN ---------- */
function scoreData(){
  let correct=0, incorrect=0, blank=0;
  let partA={correct:0,total:0}, partB={correct:0,total:0};
  QUESTIONS.forEach(q=>{
    const p = q.part==='A'?partA:partB;
    p.total++;
    const given = state.answers[q.n];
    if(given===undefined){ blank++; }
    else if(given===q.answer){ correct++; p.correct++; }
    else { incorrect++; }
  });
  return {correct,incorrect,blank,partA,partB,total:54};
}

function setReviewFilter(f){
  state.reviewFilter=f;
  render();
}

function reviewList(){
  const {reviewFilter} = state;
  let rows='';
  QUESTIONS.forEach(q=>{
    const given = state.answers[q.n];
    let status = given===undefined ? 'blank' : (given===q.answer ? 'correct' : 'incorrect');
    if(reviewFilter!=='all' && reviewFilter!==status) return;
    const label = status==='correct' ? '✓ Correct' : status==='incorrect' ? `✗ Incorrect` : '— Blank';
    rows += `<div class="review-row ${status}" onclick="openReview(${q.n})">
      <span class="num">Q${q.n}</span>
      <span>Part ${q.part} ${state.flags[q.n]?'· ★ flagged':''}</span>
      <span class="status">${label}</span>
    </div>`;
  });
  if(!rows) rows = `<div style="text-align:center; color:var(--ink-soft); padding:20px; font-size:14px;">No questions in this category.</div>`;
  return rows;
}

function openReview(n){
  state.reviewFocus=n;
  render();
  setTimeout(()=>{
    const el = document.getElementById('reviewDetail');
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  },30);
}

function closeReviewDetail(){
  state.reviewFocus=null;
  render();
}

function renderReviewDetail(){
  if(!state.reviewFocus) return '';
  const q = QUESTIONS.find(x=>x.n===state.reviewFocus);
  const given = state.answers[q.n];
  let html = `<div class="q-card" id="reviewDetail" style="margin-top:8px;">
    <div class="q-meta">
      <div><span class="q-number">QUESTION ${q.n} OF 54</span> &nbsp; <span class="q-part">Part ${q.part}</span></div>
      <button class="link-btn" onclick="closeReviewDetail()">Close ×</button>
    </div>
    <div class="q-text"><p>${q.text}</p>`;
  if(q.diagram) html += `<div class="q-diagram">${DIAGRAMS[q.diagram]}${q.caption?`<div class="diagram-caption">${q.caption}</div>`:''}</div>`;
  if(q.after) html += q.after;
  html += `</div><div class="options">`;
  q.options.forEach(([key,text])=>{
    let cls='';
    if(key===q.answer) cls='correct';
    else if(key===given) cls='incorrect';
    html += `<div class="option ${cls}">
      <div class="option-key">${key}</div>
      <div class="option-text">${text}${key===q.answer?' &nbsp;<strong style="color:var(--answered); font-family:var(--sans); font-size:12.5px;">(correct answer)</strong>':''}${key===given && key!==q.answer?' &nbsp;<strong style="color:var(--wrong); font-family:var(--sans); font-size:12.5px;">(your answer)</strong>':''}</div>
    </div>`;
  });
  if(given===undefined){
    html += `<div style="font-size:13px; color:var(--ink-soft); margin-top:6px;">You did not answer this question.</div>`;
  }
  html += `</div></div>`;
  return html;
}

function resultsSummaryText(s){
  return `ENGAA 2018 Section 1 — Results
Name: ${state.studentName||'Unnamed'}
Score: ${s.correct}/${s.total} (${Math.round((s.correct/s.total)*100)}%)
Part A: ${s.partA.correct}/${s.partA.total}
Part B: ${s.partB.correct}/${s.partB.total}
Time used: ${fmtTime(TOTAL_SECONDS-state.timeLeft)}
Answers: ${buildAnswersString()}`;
}

function copyResultsSummary(){
  const s = scoreData();
  const text = resultsSummaryText(s);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert('Results copied — paste them into an email or message to your teacher.'));
  } else {
    prompt('Copy your results below:', text);
  }
}

function retrySubmit(){
  submitResultsToTeacher(scoreData());
}

function renderSubmitStatus(){
  const st = state.submitStatus;
  let box = '';
  if(st==='sending'){
    box = `<div class="info-card" style="text-align:center; color:var(--ink-soft); font-size:13.5px;">Sending your results to your teacher…</div>`;
  } else if(st==='sent'){
    box = `<div class="info-card" style="text-align:center; color:var(--answered); font-size:13.5px; font-weight:600;">✓ Results sent to your teacher</div>`;
  } else if(st==='failed'){
    box = `<div class="info-card" style="text-align:center; font-size:13.5px;">
      <div style="color:var(--wrong); font-weight:600; margin-bottom:8px;">Couldn't send automatically — check your internet connection.</div>
      <button class="nav-btn" style="width:100%; margin-bottom:8px;" onclick="retrySubmit()">Try again</button>
      <button class="link-btn" onclick="copyResultsSummary()">Or copy your results to send manually</button>
    </div>`;
  } else if(st==='unconfigured'){
    box = `<div class="info-card" style="text-align:center; font-size:13px; color:var(--ink-soft);">
      Automatic submission isn't set up yet.
      <div style="margin-top:8px;"><button class="link-btn" onclick="copyResultsSummary()">Copy your results to send to your teacher</button></div>
    </div>`;
  }
  return box;
}

function renderResults(){
  const s = scoreData();
  const pct = Math.round((s.correct/s.total)*100);
  return `
  <div class="topbar">
    <div class="brand">
      <div class="kicker">ENGAA 2018 · SECTION 1</div>
      <div class="title">Results</div>
    </div>
    <div class="topbar-right">
      <button class="btn" style="background:rgba(255,255,255,0.12); color:#fff;" onclick="restart()">Retake test</button>
    </div>
  </div>
  <div class="screen">
    <div style="text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:2px;">${state.studentName||'Student'}</div>
    <div class="score-big">${s.correct} / ${s.total}</div>
    <div class="score-sub">${pct}% correct · ${s.blank} left blank</div>

    ${renderSubmitStatus()}

    <div class="breakdown">
      <div class="bd-card"><div class="n">${s.partA.correct}/${s.partA.total}</div><div class="l">Part A</div></div>
      <div class="bd-card"><div class="n">${s.partB.correct}/${s.partB.total}</div><div class="l">Part B</div></div>
    </div>

    <div class="info-card" style="margin-bottom:20px;">
      <h4>Summary</h4>
      <div class="info-row"><span>Correct</span><span>${s.correct}</span></div>
      <div class="info-row"><span>Incorrect</span><span>${s.incorrect}</span></div>
      <div class="info-row"><span>Blank</span><span>${s.blank}</span></div>
      <div class="info-row"><span>Time used</span><span>${fmtTime(TOTAL_SECONDS-state.timeLeft)}</span></div>
    </div>

    <h4 style="font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:10px;">Review your answers</h4>
    <div class="filter-tabs">
      <button class="${state.reviewFilter==='all'?'active':''}" onclick="setReviewFilter('all')">All 54</button>
      <button class="${state.reviewFilter==='incorrect'?'active':''}" onclick="setReviewFilter('incorrect')">Incorrect</button>
      <button class="${state.reviewFilter==='blank'?'active':''}" onclick="setReviewFilter('blank')">Blank</button>
      <button class="${state.reviewFilter==='correct'?'active':''}" onclick="setReviewFilter('correct')">Correct</button>
    </div>
    <div class="review-list">${reviewList()}</div>
    ${renderReviewDetail()}
  </div>
  `;
}

/* ---------- MAIN RENDER ---------- */
function render(){
  let html='';
  if(state.screen==='start') html = renderStart();
  else if(state.screen==='test') html = renderTest();
  else html = renderResults();
  app.innerHTML = html;
  renderMath(app);
  if(state.screen==='test') updateTimerDisplay();
}

render();
</script>
</body>
</html>
